<!DOCTYPE html?>
<head>
  <title>My Online Portfolio</title>
  <meta charset = "UTF-8">
  <meta name = "viewport" content ="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .chart-container{
      width:90%;
      max-width:800px;
      margin:30px auto;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">My Online Portfolio</h1>
  <p style="text-align:center;">I'm Sarah Ford and here is my class demo.</p>
  <div style="text-align:center;" class="image">
    <img src = "https://datawrapper.dwcdn.net/kSAnJ/1/">
  </div>
  <div class = "chart-container">
    <canvas id = chart></canvas>
  </div>
  <script>
    const data =[0,6,12,18,25,10,15,0,9,192];
    const totalDuration=1000; /*lower duration, faster animation*/
    const delayBetweenPoints=totalDuration/data.length;
    const previousY=ctx=>
      ctx.index===0
     ? ctx.chart.scales.y.getPixelForValue(0)
      :ctx.chart
    .getDatasetMeta(ctx.datasetIndex)
    .data[ctx.index-1]
    .getProps(["y"],true).y;

    const animation={
      x:{
        type:"number",
        easing:"linear",
        duration:delayBetweenPoints,
        from: NaN,
        delay(ctx){
          if (ctx.type!=="data"||ctx.xStarted){
            return 0;
          }
          
          ctx.xStarted = true;
          return ctx.index * delayBetweenPoints;
        }
      }
    };
          
    const ctx=document.getElementById("chart");
    new Chart(ctx,{
      type: "line",
      data: {
        labels:["August","September","October","November","December","January","Feburary","March","April","May"],
        datasets:[{
          label:"Coffee Spending",
          data: [0,6,12,18,25,10,15,0,9,192],

          borderColor: "#FF0145",
          backgroundColor:"#E3DCDC",
          borderWidth:3,
          fill:true,
          tension:0.35, 
          pointRadius:4,
          pointBackgroundColor:"#FF0145"
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:true,
        
        animation: animation,
      
        interaction:{
          intersect:false
        },
        plugins:{
          legend:{
            display:true
          }
        },
          scales: {
          y:{
            beginAtZero:true
          }
        }
      }
    });
  </script>
</body>
</html>
